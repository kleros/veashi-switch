<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Ask Kleros Court to switch a GatewayLightbulb and follow the dispute across the Veashi gateways." />
    <title>Kleros · Gateway Lightbulb</title>
    <script>
      // The saved theme before the first paint (src/theme/ThemeMode.tsx keeps it from then on), so the boot loader
      // below and the page background already match it. Dark when nothing is saved, as in ThemeMode.
      try {
        var saved = localStorage.getItem("veashi-switch-theme");
        if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {
        // storage unavailable: dark
      }
      document.documentElement.style.colorScheme = document.documentElement.getAttribute("data-theme");
    </script>
    <style>
      /*
       * The boot loader: shown until the app mounts and replaces #root's content. It is the mark of
       * src/components/Loader.tsx in plain HTML and CSS (keep the two in step), coloured with the theme tokens of
       * src/theme/tokens.ts, hard-coded here because the app's CSS variables do not exist yet.
       * :where() keeps the page background at zero specificity, so the app's global style wins once it loads.
       */
      :where(html) { background: #1b003f; }
      :where(html[data-theme="light"]) { background: #fafbfc; }
      .boot {
        --b-ground: #1b003f; --b-text: #becce5; --b-line: #4b3a8f; --b-dot: #b45fff; --b-mark: #9aa6cf;
        --b-glass: #2d1865; --b-on: #ffd36b; --b-halo: rgba(255, 211, 107, 0.28); --b-fil-on: #8a5a00;
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        background: var(--b-ground);
        color: var(--b-text);
        font: 15px/1.5 "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      [data-theme="light"] .boot {
        --b-ground: #fafbfc; --b-text: #5c5c66; --b-line: #cfc4e6; --b-dot: #9013fe; --b-mark: #6a6a74;
        --b-glass: #f4f0fa; --b-on: #ffc233; --b-halo: rgba(255, 176, 0, 0.25); --b-fil-on: #8a5a00;
      }
      .boot-mark {
        position: relative;
        flex: none;
        width: 2.75em;
        height: 1.25em;
        font-size: 28px;
        animation: boot-in 200ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-strand {
        position: absolute; left: 0; top: 50%; width: 1.8em; height: 2px; margin-top: -1px;
        border-radius: 1px; background: var(--b-line);
      }
      .boot-dot {
        position: absolute; left: 0.0625em; top: 50%; width: 0.375em; height: 0.375em; margin-top: -0.1875em;
        border-radius: 50%; background: var(--b-dot);
        animation: boot-travel 1.6s linear infinite;
      }
      .boot-bulb, .boot-lit { position: absolute; right: 0; top: 0; width: 1.125em; height: 1.25em; }
      .boot-bulb svg, .boot-lit svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .boot-lit { opacity: 0; animation: boot-glow 1.6s ease-in-out infinite; }
      .boot .glass { fill: var(--b-glass); stroke: var(--b-mark); }
      .boot .fil { stroke: var(--b-mark); }
      .boot .screw { fill: var(--b-mark); }
      .boot .halo { fill: var(--b-halo); }
      .boot .glass-on { fill: var(--b-on); stroke: var(--b-on); }
      .boot .fil-on { stroke: var(--b-fil-on); }
      @keyframes boot-travel {
        0% { transform: translateX(0); opacity: 0; }
        12% { opacity: 1; }
        55% { transform: translateX(1.25em); opacity: 1; }
        62%, 100% { transform: translateX(1.25em); opacity: 0; }
      }
      @keyframes boot-glow {
        0%, 50% { opacity: 0; }
        64% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes boot-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark, .boot-lit { animation: none; }
        .boot-dot { animation: none; transform: translateX(0.625em); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" data-testid="boot-loader">
        <span class="boot-mark" aria-hidden="true">
          <span class="boot-strand"></span>
          <span class="boot-dot"></span>
          <span class="boot-bulb">
            <svg viewBox="0 0 18 20" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path class="glass" stroke-width="1.4" d="M9 1.2a6.8 6.8 0 0 0-3.9 12.4c.5.4.9 1 .9 1.6v.6h6v-.6c0-.6.4-1.2.9-1.6A6.8 6.8 0 0 0 9 1.2z" />
              <path class="fil" stroke-width="1.1" d="M7.2 12.6V10l.9-2 .9 1.6.9-1.6.9 2v2.6" />
              <rect class="screw" x="5.8" y="16.6" width="6.4" height="1.4" rx="0.7" />
              <rect class="screw" x="6.8" y="18.6" width="4.4" height="1.2" rx="0.6" opacity="0.7" />
            </svg>
          </span>
          <span class="boot-lit">
            <svg viewBox="0 0 18 20" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle class="halo" cx="9" cy="8" r="8.6" />
              <path class="glass-on" stroke-width="1.4" d="M9 1.2a6.8 6.8 0 0 0-3.9 12.4c.5.4.9 1 .9 1.6v.6h6v-.6c0-.6.4-1.2.9-1.6A6.8 6.8 0 0 0 9 1.2z" />
              <path class="fil-on" stroke-width="1.1" d="M7.2 12.6V10l.9-2 .9 1.6.9-1.6.9 2v2.6" />
            </svg>
          </span>
        </span>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
