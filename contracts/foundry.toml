# Devnet-only forge project: the Yaho/Yaru/reporter/adapter mocks and a mock USDC, plus the Kleros v2 gateways,
# lightbulb and KlerosCoreRuler pulled in through src/Imports.sol from the vendored copy in lib/kleros-v2 (their
# import closure only; see lib/kleros-v2/README.md).
[profile.default]
solc = "0.8.30"
via_ir = true
optimizer = true
optimizer_runs = 500
src = "src"
out = "out"
cache_path = "cache"
libs = ["lib", "../node_modules"]
allow_paths = ["../node_modules"]
remappings = [
    "@openzeppelin/=../node_modules/@openzeppelin/",
    "@kleros/=../node_modules/@kleros/",
    "kleros-v2/=lib/kleros-v2/src/",
]

[lint]
lint_on_build = false
